  html+='</section>';
});

/* 輪播按鈕 */
document.querySelectorAll(".car").forEach(function(c){var r=c.querySelector(".rail");
  c.querySelector(".l").onclick=function(){r.scrollBy({left:-320,behavior:"smooth"})};
  c.querySelector(".r").onclick=function(){r.scrollBy({left:320,behavior:"smooth"})};});
/* 導覽列高亮 */
var links=nav.querySelectorAll("a");
function spy(){var cur="";document.querySelectorAll("section").forEach(function(s){if(s.getBoundingClientRect().top<120)cur=s.id;});
  links.forEach(function(l){var on=l.dataset.id===cur;l.classList.toggle("on",on);if(on&&nav.parentNode.scrollWidth>nav.parentNode.clientWidth){nav.parentNode.scrollLeft=l.offsetLeft-20;}});}
addEventListener("scroll",spy,{passive:true});spy();
}

  fetch(SHEET_CSV).then(function(r){return r.text()}).then(function(t){try{applySheet(t)}catch(e){}go();}).catch(go);}
else render();
